# The dev backend's host. /api goes to the dev backend; everything else — item
# art, paints, models, music — goes to the INSTALLED plugin's frontend, which
# already serves the shared mount, so nothing is copied or duplicated.
#
# Filled in by scripts/dev-backend.sh: __DOMAIN__, __CLASS__ (the live ingress's
# class), the TLS block when the live plugin terminates TLS in the cluster, and
# — only after `scripts/dev-backend.sh assets on` — five asset paths in place
# of the ASSETS marker below. They send /models, /paints, /images, /music and
# /anims on THIS host to the dev backend instead, so the dev copy is served
# with this fork's caching and compression (docs/CACHING.md). Same files either
# way: both read the one shared mount. The installed plugin's host is never
# touched.
apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: inventory-dev
  namespace: 5stack
  annotations:
    # Same as the live api ingress: paint composites are uploaded through /api
    # and run to a few MB (see k8s/base/ingress.yaml).
    nginx.ingress.kubernetes.io/proxy-body-size: 64m
spec:
  ingressClassName: __CLASS__
  rules:
    - host: __DOMAIN__
      http:
        paths:
          - backend:
              service:
                name: inventory-dev-backend
                port:
                  number: 3000
            path: /api
            pathType: Prefix
          #__ASSETS__
          - backend:
              service:
                name: inventory-frontend
                port:
                  number: 80
            path: /
            pathType: Prefix
  #__TLS__
